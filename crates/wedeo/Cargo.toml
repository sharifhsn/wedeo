[package]
name = "wedeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust Universal A/V Adapter — ergonomic facade and audio/video readers"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["audio-ops", "video-ops", "syntax", "graph", "pcm", "wav", "h264", "vp9", "mp4", "mkv", "ivf", "symphonia", "rav1e"]
audio-ops = ["dep:wedeo-audio-ops"]
video-ops = ["dep:wedeo-video-ops"]
syntax = ["dep:wedeo-syntax"]
graph = ["dep:wedeo-graph", "audio-ops", "video-ops", "syntax"]
gpu-wgpu = ["dep:wedeo-gpu-wgpu", "video-ops"]
pcm = ["dep:wedeo-codec-pcm"]
wav = ["dep:wedeo-format-wav"]
h264 = ["dep:wedeo-codec-h264", "syntax"]
vp9 = ["dep:wedeo-codec-vp9", "syntax"]
mp4 = ["dep:wedeo-format-mp4", "syntax"]
mkv = ["dep:wedeo-format-mkv", "syntax"]
ivf = ["dep:wedeo-format-ivf"]
symphonia = ["dep:wedeo-symphonia"]
rav1e = ["dep:wedeo-rav1e"]
rav1d = ["dep:wedeo-rav1d"]

[dependencies]
wedeo-core.workspace = true
wedeo-audio-ops = { workspace = true, optional = true }
wedeo-video-ops = { workspace = true, optional = true }
wedeo-syntax = { workspace = true, optional = true }
wedeo-graph = { workspace = true, optional = true }
wedeo-gpu-wgpu = { workspace = true, optional = true }
wedeo-codec-pcm = { workspace = true, optional = true }
wedeo-format-wav = { workspace = true, optional = true }
wedeo-codec-h264 = { workspace = true, optional = true }
wedeo-codec-vp9 = { workspace = true, optional = true }
wedeo-format-mp4 = { workspace = true, optional = true }
wedeo-format-mkv = { workspace = true, optional = true }
wedeo-format-ivf = { workspace = true, optional = true }
wedeo-symphonia = { workspace = true, optional = true }
wedeo-rav1e = { workspace = true, optional = true }
wedeo-rav1d = { workspace = true, optional = true }
