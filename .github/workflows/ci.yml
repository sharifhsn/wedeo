name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Unit & integration tests
        run: cargo nextest run --profile ci --exclude wedeo-oracle
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/nextest/ci/junit.xml

  fate-regression:
    name: FATE Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache FATE H.264 samples
        uses: actions/cache@v4
        id: fate-cache
        with:
          path: fate-suite/h264-conformance
          key: fate-h264-conformance-v1

      - name: Fetch FATE H.264 samples
        if: steps.fate-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          mkdir -p fate-suite
          rsync -a rsync://fate-suite.ffmpeg.org/fate-suite/h264-conformance fate-suite/

      - name: Build wedeo-framecrc
        run: cargo build --release --bin wedeo-framecrc -p wedeo-oracle

      # Regression check: compare against committed baselines.
      # Exits 0 if no previously-passing test regressed.
      # New failures on tests not in the baseline are allowed.
      - name: Check for regressions
        id: regression
        run: |
          set -o pipefail
          python3 scripts/suite_runner.py \
            --suite fate-cavlc,fate-cabac \
            --check-snapshot \
            --snapshot-dir test_suites/baselines \
            2>&1 | tee /tmp/fate-results.txt

      - name: Post summary
        if: always()
        run: |
          echo '## FATE Regression Check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/fate-results.txt ]; then
            cat /tmp/fate-results.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No results (build or download may have failed)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  jvt-regression:
    name: JVT Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache JVT vectors
        uses: actions/cache@v4
        with:
          path: jvt-vectors
          key: jvt-vectors-${{ hashFiles('test_suites/h264/*.json') }}

      - name: Build wedeo-framecrc
        run: cargo build --release --bin wedeo-framecrc -p wedeo-oracle

      - name: Download JVT vectors
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/fetch_jvt.py --jobs 8

      # Regression check: compare against committed baselines.
      - name: Check for regressions
        id: regression
        run: |
          set -o pipefail
          python3 scripts/suite_runner.py \
            --suite jvt-avc-v1,jvt-fr-ext \
            --format yuv420p \
            --check-snapshot \
            --snapshot-dir test_suites/baselines \
            2>&1 | tee /tmp/jvt-results.txt

      - name: Post summary
        if: always()
        run: |
          echo '## JVT Regression Check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/jvt-results.txt ]; then
            cat /tmp/jvt-results.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No results (build or download may have failed)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  oracle-gates:
    name: Oracle Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Architecture DAG & unsafe lint (oracle_arch_lint)
        run: cargo test -p wedeo-oracle --test oracle_arch_lint
      - name: DOD allocation gate (oracle_dod_alloc)
        run: cargo test -p wedeo-oracle --test oracle_dod_alloc

  gpu-graph:
    name: GPU graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers nasm libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Verify device uploads and conversions on Vulkan
        run: cargo test --locked -p wedeo-gpu-wgpu -- --include-ignored
      - name: Dispatch shaders and read back pixels
        run: cargo test --locked -p wedeo-oracle --features gpu-readback --test gpu_readback -- --nocapture

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bins/wedeo-wasm
      - name: Clippy (wedeo-wasm)
        run: cargo clippy --manifest-path bins/wedeo-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests (wedeo-wasm)
        run: cargo test --manifest-path bins/wedeo-wasm/Cargo.toml
      - name: Build wasm32 target
        run: cargo build --manifest-path bins/wedeo-wasm/Cargo.toml --target wasm32-unknown-unknown --profile wasm-release

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri (wedeo-core)
        run: cargo +nightly miri test -p wedeo-core
      - name: Miri (wedeo-rav1d)
        run: cargo +nightly miri test -p wedeo-rav1d --lib
      - name: Miri (wedeo-codec-pcm)
        run: cargo +nightly miri test -p wedeo-codec-pcm --lib
      - name: Miri (wedeo-codec-vp9)
        run: cargo +nightly miri test -p wedeo-codec-vp9 --lib
      - name: Miri (wedeo-codec-h264)
        run: cargo +nightly miri test -p wedeo-codec-h264 --lib
      - name: Miri (wedeo-syntax)
        run: cargo +nightly miri test -p wedeo-syntax --lib -- --skip raw_demuxer_streams_across_tiny_chunks_and_compacts
      - name: Miri (wedeo-graph)
        run: cargo +nightly miri test -p wedeo-graph --lib
      - name: Miri (wedeo-wasm)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly miri test --manifest-path bins/wedeo-wasm/Cargo.toml --lib
