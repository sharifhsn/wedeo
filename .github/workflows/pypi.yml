name: Publish Python package
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: python -m pip install 'maturin>=1.9,<2' uv
      - run: maturin build --release --out dist && maturin sdist --out dist
      - name: Check the packaged executable
        run: |
          wheel=$(ls dist/*.whl)
          uvx --from "$PWD/$wheel" wedeo ffprobe -show_streams -of json web/samples/h264_aac_320x240.mp4 | jq -e 'any(.streams[]; .codec_name == "h264")'
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
