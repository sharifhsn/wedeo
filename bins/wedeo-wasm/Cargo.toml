[workspace]

[package]
name = "wedeo-wasm"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "LGPL-2.1-or-later"
repository = "https://github.com/sharifhsn/wedeo"
description = "Pure-Rust WebAssembly entrypoint for Wedeo (inspect, H.264/VP9/audio decode, SwsOpList, remux)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wedeo = { path = "../../crates/wedeo", default-features = false, features = [
    "audio-ops",
    "video-ops",
    "syntax",
    "graph",
    "pcm",
    "wav",
    "h264",
    "vp9",
    "mp4",
    "mkv",
    "ivf",
    "symphonia",
] }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
