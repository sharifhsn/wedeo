[package]
name = "wedeo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified wedeo CLI (inspect/transcode/cut/mux/explain, wedeo ffmpeg, and wedeo mcp)"
publish = false

[lints]
workspace = true

[[bin]]
name = "wedeo"
path = "src/main.rs"

[features]
gpu-wgpu = ["wedeo/gpu-wgpu"]

[dependencies]
wedeo = { workspace = true, features = ["rav1d"] }
