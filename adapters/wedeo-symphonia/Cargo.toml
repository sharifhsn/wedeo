[package]
name = "wedeo-symphonia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Segregated Symphonia fallback audio adapter for wedeo"

[lints]
workspace = true

[dependencies]
wedeo-core.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "isomp4", "mkv", "ogg", "wav", "aiff", "caf", "adpcm", "opt-simd",
] }
opus-decoder = "0.1.1"
