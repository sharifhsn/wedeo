[workspace]
members = [
    "crates/wedeo-core",
    "crates/wedeo-syntax",
    "crates/wedeo-video-ops",
    "crates/wedeo-audio-ops",
    "crates/wedeo-graph",
    "crates/wedeo-gpu-wgpu",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "LGPL-2.1-or-later"
repository = "https://github.com/sharifhsn/wedeo"
keywords = ["video", "ffmpeg", "h264", "codec", "multimedia"]
categories = ["multimedia::video", "multimedia::encoding"]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
bitflags = "2"
bytemuck = "1"
pollster = "0.4"
wgpu = "29"

wedeo-core = { path = "crates/wedeo-core", version = "0.3.0" }
wedeo-syntax = { path = "crates/wedeo-syntax", version = "0.3.0" }
wedeo-video-ops = { path = "crates/wedeo-video-ops", version = "0.3.0" }
wedeo-audio-ops = { path = "crates/wedeo-audio-ops", version = "0.3.0" }
wedeo-graph = { path = "crates/wedeo-graph", version = "0.3.0" }
wedeo-gpu-wgpu = { path = "crates/wedeo-gpu-wgpu", version = "0.3.0" }
